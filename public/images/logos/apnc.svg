<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="apncGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B6B53" />
      <stop offset="100%" stop-color="#15936F" />
    </linearGradient>
  </defs>
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="94" fill="#ffffff" stroke="#0B6B53" stroke-width="6" />
  <circle cx="100" cy="100" r="86" fill="none" stroke="#D59B2C" stroke-width="2.5" />
  <circle cx="100" cy="100" r="80" fill="#f0fdf4" stroke="#0B6B53" stroke-width="1.5" />
  
  <!-- Text paths -->
  <path id="textApncTop" d="M 30,100 A 70,70 0 1,1 170,100" fill="none" />
  <path id="textApncBottom" d="M 170,100 A 70,70 0 0,1 30,100" fill="none" />
  
  <text font-family="Arial, sans-serif" font-size="10.5" font-weight="900" fill="#0B6B53" letter-spacing="1.5">
    <textPath href="#textApncTop" startOffset="50%" text-anchor="middle">
      A.P. NURSES &amp; MIDWIVES COUNCIL
    </textPath>
  </text>
  
  <text font-family="Arial, sans-serif" font-size="10" font-weight="800" fill="#123B68" letter-spacing="2">
    <textPath href="#textApncBottom" startOffset="50%" text-anchor="middle">
      VIJAYAWADA • GOVT. OF A.P.
    </textPath>
  </text>

  <!-- Center Crest -->
  <circle cx="100" cy="100" r="48" fill="url(#apncGrad)" stroke="#D59B2C" stroke-width="2" />
  
  <!-- Florence Nightingale Lamp & Flame Symbol -->
  <!-- Lamp Base and body -->
  <path d="M76,112 C76,124 124,124 124,112 C120,112 112,110 100,110 C88,110 80,112 76,112 Z" fill="#D59B2C" />
  <path d="M86,122 L114,122 L118,127 L82,127 Z" fill="#D59B2C" />
  <!-- Spout -->
  <path d="M76,112 C70,108 66,104 68,98 C72,98 76,106 82,110 Z" fill="#D59B2C" />
  <!-- Handle -->
  <path d="M122,112 C132,106 132,96 124,96 C118,96 118,104 120,110" fill="none" stroke="#D59B2C" stroke-width="3" stroke-linecap="round" />
  
  <!-- Flame of Florence Nightingale -->
  <path d="M68,96 C64,90 68,80 71,74 C74,80 78,86 74,94 C72,97 70,97 68,96 Z" fill="#ffffff" />
  <path d="M69,93 C67,88 69,82 71,78 C73,82 75,87 72,92 Z" fill="#F3C358" />

  <!-- Red Cross Emblem on Lamp Center -->
  <rect x="97" y="103" width="6" height="14" fill="#ffffff" rx="1" />
  <rect x="93" y="107" width="14" height="6" fill="#ffffff" rx="1" />
  <rect x="98" y="104" width="4" height="12" fill="#ef4444" rx="0.5" />
  <rect x="94" y="108" width="12" height="4" fill="#ef4444" rx="0.5" />
