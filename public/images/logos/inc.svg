<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="incGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A1515" />
      <stop offset="100%" stop-color="#7C2323" />
    </linearGradient>
    <linearGradient id="incGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D59B2C" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
  </defs>

  <!-- Outer circle -->
  <circle cx="100" cy="100" r="94" fill="#ffffff" stroke="#4A1515" stroke-width="6" />
  <circle cx="100" cy="100" r="86" fill="none" stroke="#D59B2C" stroke-width="2.5" />
  <circle cx="100" cy="100" r="80" fill="#fffbeb" stroke="#4A1515" stroke-width="1.5" />
  
  <!-- Text paths -->
  <path id="textIncTop" d="M 30,100 A 70,70 0 1,1 170,100" fill="none" />
  <path id="textIncBottom" d="M 170,100 A 70,70 0 0,1 30,100" fill="none" />
  
  <text font-family="Arial, sans-serif" font-size="11" font-weight="900" fill="#4A1515" letter-spacing="1.5">
    <textPath href="#textIncTop" startOffset="50%" text-anchor="middle">
      INDIAN NURSING COUNCIL
    </textPath>
  </text>
  
  <text font-family="Arial, sans-serif" font-size="10.5" font-weight="800" fill="#123B68" letter-spacing="2">
    <textPath href="#textIncBottom" startOffset="50%" text-anchor="middle">
      NEW DELHI • नई दिल्ली
    </textPath>
  </text>

  <!-- Center Crest -->
  <circle cx="100" cy="100" r="48" fill="url(#incGrad)" stroke="#D59B2C" stroke-width="2" />
  
  <!-- Sun Rays behind Lamp -->
  <g stroke="#D59B2C" stroke-width="1.5" opacity="0.6">
    <line x1="100" y1="58" x2="100" y2="66" />
    <line x1="88" y1="61" x2="92" y2="68" />
    <line x1="112" y1="61" x2="108" y2="68" />
    <line x1="78" y1="70" x2="84" y2="75" />
    <line x1="122" y1="70" x2="116" y2="75" />
  </g>

  <!-- Florence Nightingale Lamp Symbol -->
  <!-- Lamp Base & Oil vessel -->
  <path d="M74,116 C74,126 126,126 126,116 C122,116 114,113 100,113 C86,113 78,116 74,116 Z" fill="url(#incGold)" />
  <path d="M84,124 L116,124 L120,130 L80,130 Z" fill="#D59B2C" />
  
  <!-- Spout -->
  <path d="M74,116 C66,110 64,104 66,98 C72,98 76,108 82,113 Z" fill="url(#incGold)" />
  
  <!-- Handle -->
  <path d="M124,116 C134,110 134,98 126,98 C120,98 120,106 122,114" fill="none" stroke="url(#incGold)" stroke-width="3" stroke-linecap="round" />
  
  <!-- Flame of Compassion -->
  <path d="M66,96 C62,88 66,76 70,70 C74,78 78,85 73,94 C71,97 68,97 66,96 Z" fill="#ffffff" />
  <path d="M67,93 C65,87 67,80 70,75 C72,80 74,86 71,91 Z" fill="#FBBF24" />

  <!-- Open Book & Nursing Cross on Center -->
  <path d="M86,102 Q100,97 100,105 Q100,97 114,102 L114,110 Q100,105 100,113 Q100,105 86,110 Z" fill="#ffffff" opacity="0.95" />
  <rect x="98.5" y="100" width="3" height="9" fill="#ef4444" rx="0.5" />
  <rect x="95.5" y="103" width="9" height="3" fill="#ef4444" rx="0.5" />
</svg>
